name: R reproducibility

on:
  push:
    paths:
      - '**.R'
      - '**.r'
      - '**.Rmd'
      - '**.rmd'
      - '**.qmd'
      - '**.csv'
      - '**.CSV'
      - '**.xlsx'
      - '**.xls'
      - '**.rds'
      - '**.RData'
      - '**.json'
      - '**.txt'
      - '.github/ci/**'
      - '.github/workflows/r-reproducibility.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.R'
      - '**.r'
      - '**.Rmd'
      - '**.rmd'
      - '**.qmd'
      - '**.csv'
      - '**.CSV'
      - '**.xlsx'
      - '**.xls'
      - '**.rds'
      - '**.RData'
      - '**.json'
      - '**.txt'
      - '.github/ci/**'
      - '.github/workflows/r-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: Execute submitted R code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select submissions
        id: select
        run: python3 .github/ci/select_files.py
      - uses: r-lib/actions/setup-r@v2
        if: steps.select.outputs.count != '0'
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.select.outputs.count != '0'
        with:
          working-directory: .github/ci
          packages: deps::., any::sessioninfo
          cache-version: 1
      - name: Execute each submission in a fresh session
        if: steps.select.outputs.count != '0'
        run: python3 .github/ci/run_checks.py
      - name: Save execution logs and results
        if: always() && steps.select.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: r-execution-results
          path: ${{ runner.temp }}/r-reproducibility/results/
          if-no-files-found: ignore
          retention-days: 14
